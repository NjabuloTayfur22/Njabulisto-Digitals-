<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080">
  <title>Njabulisto Catalog Cards</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
  <!--
    One 1080x1080 card per catalog item. Open with ?item=bookdirect (etc.) to see one card.
    Without ?item, all cards are shown one under the other.
  -->
  <style>
    :root { --ink: #0B0D17; --ink-2: #151827; --lime: #C8F560; --ocean: #1FB5A8; --coral: #FF6A4D; --violet: #8B6BFF; --muted: #9AA0B4; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #222; font-family: "Inter", sans-serif; -webkit-font-smoothing: antialiased; }
    .card {
      width: 1080px; height: 1080px; position: relative; overflow: hidden; color: #fff;
      background: var(--ink); padding: 76px 80px; display: flex; flex-direction: column;
    }
    .card + .card { margin-top: 40px; }
    .glow { position: absolute; border-radius: 50%; filter: blur(110px); pointer-events: none; }
    .g1 { width: 620px; height: 620px; right: -180px; top: -200px; background: var(--accent); opacity: .42; }
    .g2 { width: 460px; height: 460px; left: -200px; bottom: -220px; background: #6A4DFF; opacity: .28; }
    .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px); background-size: 72px 72px; mask-image: radial-gradient(ellipse at 70% 30%, #000 20%, transparent 70%); }
    .top { position: relative; display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; align-items: center; gap: 14px; font: 800 34px "Syne"; letter-spacing: -0.03em; }
    .brand img { width: 62px; height: 62px; }
    .brand b { color: var(--ocean); }
    .pill { font: 700 22px "Inter"; letter-spacing: .14em; text-transform: uppercase; padding: 12px 22px; border-radius: 999px; background: var(--accent); color: var(--ink); }
    .body { position: relative; flex: 1; display: grid; grid-template-columns: 560px 1fr; align-items: center; gap: 10px; }
    h1 { font: 800 86px/0.98 "Syne"; letter-spacing: -0.04em; margin-top: 10px; }
    .price { font: 800 98px/1 "Syne"; letter-spacing: -0.04em; color: var(--accent); margin-top: 30px; }
    .price small { display: block; font: 600 30px "Inter"; color: var(--muted); letter-spacing: 0; margin-top: 10px; }
    ul { list-style: none; margin-top: 34px; display: grid; gap: 18px; }
    li { font: 600 33px/1.25 "Inter"; display: flex; gap: 16px; align-items: flex-start; color: #E9EBF2; }
    li::before { content: "✓"; flex: none; width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,.1); color: var(--accent); display: grid; place-items: center; font-size: 24px; font-weight: 700; margin-top: -1px; }
    .art { position: relative; height: 640px; }
    .foot { position: relative; display: flex; justify-content: space-between; align-items: center; padding-top: 30px; border-top: 1.5px solid rgba(255,255,255,.12); font: 600 27px "Inter"; color: #C9CDD9; }
    .foot b { color: #fff; }

    /* Shared illustration pieces */
    .phone { position: absolute; width: 300px; height: 600px; border-radius: 48px; padding: 13px; background: linear-gradient(160deg, #2C3047, #12141F); box-shadow: 0 50px 90px -30px rgba(0,0,0,.9), inset 0 0 0 2px rgba(255,255,255,.12); }
    .screen { width: 100%; height: 100%; border-radius: 36px; overflow: hidden; background: #FBF8F2; position: relative; color: #1A1C26; }
    .notch { position: absolute; top: 10px; left: 50%; translate: -50% 0; width: 90px; height: 24px; border-radius: 20px; background: #12141F; z-index: 3; }
    .bubble { position: absolute; background: #fff; color: #1A1C26; border-radius: 22px; padding: 18px 22px; box-shadow: 0 30px 60px -24px rgba(0,0,0,.8); font: 600 22px/1.3 "Inter"; }
    .bubble small { display: block; font-weight: 500; font-size: 17px; color: #6B7085; margin-top: 4px; }
    .stamp { position: absolute; width: 190px; height: 190px; border-radius: 50%; display: grid; place-items: center; text-align: center; font: 800 34px/1 "Syne"; transform: rotate(-14deg); background: var(--accent); color: var(--ink); box-shadow: 0 30px 60px -20px rgba(0,0,0,.7); }
  </style>
</head>
<body>
<div id="cards"></div>

<script>
  const LOGO = "../../assets/logo-mark.svg";
  const FOOT = `<span>✓ <b>Pay 50% now</b>, rest when happy</span><span>WhatsApp 068 483 9679</span>`;

  // Small inline drawings for the phone screens
  const sea = (h) => `<svg viewBox="0 0 300 ${h}" preserveAspectRatio="xMidYMid slice" style="display:block;width:100%;height:${h}px">
    <defs><linearGradient id="s${h}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7A26B"/><stop offset=".6" stop-color="#FCE3B8"/></linearGradient></defs>
    <rect width="300" height="${h}" fill="url(#s${h})"/><circle cx="210" cy="${h*.55}" r="36" fill="#FFF3D6"/>
    <path d="M0 ${h*.62} Q 80 ${h*.56} 150 ${h*.62} T 300 ${h*.6} V${h} H0Z" fill="#2A9D8F"/>
    <path d="M0 ${h*.84} Q 100 ${h*.78} 190 ${h*.86} T 300 ${h*.82} V${h} H0Z" fill="#E9D2A6"/></svg>`;
  const waIcon = `<svg viewBox="0 0 24 24" width="30" height="30" fill="#25D366"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2z"/><path fill="#fff" d="M17.3 16.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.1 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.7-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>`;
  const site = (title) => `<div class="notch"></div>${sea(250)}
    <div style="position:absolute;left:20px;top:176px;color:#fff;font:800 28px/1 Syne;text-shadow:0 2px 12px rgba(0,0,0,.3)">${title}</div>
    <div style="padding:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 8px 22px -10px rgba(0,0,0,.25);font:600 15px Inter">
        <span>Book direct<br><span style="font-weight:500;color:#6B7085;font-size:13px">Best rate, no fees</span></span>
        <span style="background:#1E6E66;color:#fff;padding:9px 12px;border-radius:11px;font-size:14px">Check dates</span></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px">
        <div style="height:120px;border-radius:14px;background:linear-gradient(135deg,#BFE3DE,#5FB3A8)"></div>
        <div style="height:120px;border-radius:14px;background:linear-gradient(135deg,#F6D7B0,#E9A86E)"></div>
      </div></div>`;

  const ITEMS = {
    mockup: {
      accent: "#FF6A4D", pill: "Start here", title: "Free<br>Mockup", price: "FREE", unit: "no catch, no obligation",
      points: ["See your website before you pay", "Made with your name & photos", "Sent to you in 48 hours"],
      art: `<div class="phone" style="right:30px;top:20px;transform:rotate(6deg)"><div class="screen">${site("Your Name<br>Here")}</div></div>
            <div class="stamp" style="left:0;bottom:30px">FREE<br><span style="font-size:22px">preview</span></div>`
    },
    getfound: {
      accent: "#1FB5A8", pill: "Show up on Google", title: "Get<br>Found", price: "R1,500", unit: "once-off",
      points: ["Google profile set up properly", "Photos, hours & map pin", "WhatsApp Business + auto-replies"],
      art: `<svg viewBox="0 0 300 300" style="position:absolute;right:40px;top:40px;width:380px;filter:drop-shadow(0 40px 50px rgba(0,0,0,.6))">
              <path d="M150 20c-55 0-98 42-98 96 0 72 98 164 98 164s98-92 98-164c0-54-43-96-98-96z" fill="#1FB5A8"/>
              <circle cx="150" cy="116" r="44" fill="#0B0D17"/><circle cx="150" cy="116" r="20" fill="#C8F560"/></svg>
            <div class="bubble" style="left:0;bottom:70px;width:400px">
              <div style="font:700 25px Inter">Your Guesthouse</div>
              <div style="color:#F4B400;font-size:24px;letter-spacing:2px;margin-top:4px">★★★★★ <span style="color:#1A1C26;font-size:20px;letter-spacing:0">4.9</span></div>
              <small>Guest house · Summerstrand · Open now</small>
              <div style="display:flex;gap:8px;margin-top:12px"><span style="background:#E8F0FE;color:#1A73E8;border-radius:99px;padding:7px 14px;font-size:16px">Directions</span><span style="background:#E7F8EE;color:#128C4A;border-radius:99px;padding:7px 14px;font-size:16px">WhatsApp</span></div>
            </div>`
    },
    bookdirect: {
      accent: "#C8F560", pill: "Most popular", title: "Book<br>Direct", price: "R4,500", unit: "once-off",
      points: ["Your own booking website", "Bookings straight to WhatsApp", "No commission. Live in 7 days"],
      art: `<div class="phone" style="right:40px;top:10px;transform:rotate(-5deg)"><div class="screen">${site("Your<br>Guesthouse")}</div></div>
            <div class="bubble" style="left:-10px;top:120px;display:flex;gap:14px;align-items:center">${waIcon}<span>New booking<small>3 nights · Sea View Suite</small></span></div>
            <div class="bubble" style="left:30px;bottom:60px;display:flex;gap:14px;align-items:center"><span style="font-size:30px">💸</span><span>R540 commission kept<small>Booked direct, no app</small></span></div>`
    },
    plus: {
      accent: "#8B6BFF", pill: "Look the best", title: "Book Direct<br>Plus", price: "R6,500", unit: "once-off",
      points: ["Everything in Book Direct", "Logo refresh & brand colours", "Facebook & Instagram set up"],
      art: `<div class="phone" style="right:20px;top:30px;transform:rotate(5deg)"><div class="screen">${site("Your<br>Brand")}</div></div>
            <div style="position:absolute;left:10px;top:90px;width:170px;height:170px;border-radius:40px;background:linear-gradient(135deg,#8B6BFF,#FF6A4D);display:grid;place-items:center;box-shadow:0 30px 60px -20px rgba(0,0,0,.8);transform:rotate(-10deg)">
              <div style="width:96px;height:96px;border-radius:28px;border:9px solid #fff;position:relative"><div style="position:absolute;inset:18px;border-radius:50%;border:9px solid #fff"></div></div></div>
            <div style="position:absolute;left:40px;bottom:80px;width:150px;height:150px;border-radius:36px;background:#1877F2;display:grid;place-items:center;font:800 110px/1 Inter;color:#fff;box-shadow:0 30px 60px -20px rgba(0,0,0,.8);transform:rotate(8deg)">f</div>`
    },
    care: {
      accent: "#1FB5A8", pill: "Monthly", title: "Care<br>Plan", price: "R350", unit: "/ month",
      points: ["Hosting & security handled", "Price & photo updates", "Cancel anytime"],
      art: `<svg viewBox="0 0 300 340" style="position:absolute;right:60px;top:40px;width:360px;filter:drop-shadow(0 40px 50px rgba(0,0,0,.6))">
              <defs><linearGradient id="sh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1FB5A8"/><stop offset="1" stop-color="#C8F560"/></linearGradient></defs>
              <path d="M150 10 270 55v95c0 85-55 150-120 180C85 300 30 235 30 150V55z" fill="url(#sh)"/>
              <path d="M95 170l40 40 75-85" fill="none" stroke="#0B0D17" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <div class="bubble" style="left:0;bottom:150px;display:flex;gap:12px;align-items:center"><span style="font-size:28px">✅</span><span>Prices updated<small>Today, 09:14</small></span></div>
            <div class="bubble" style="left:60px;bottom:40px;display:flex;gap:12px;align-items:center"><span style="font-size:28px">🔒</span><span>Site secure & online<small>Checked this week</small></span></div>`
    }
  };

  const only = new URLSearchParams(location.search).get("item");
  const html = Object.entries(ITEMS).filter(([k]) => !only || k === only).map(([k, it]) => `
    <section class="card" id="${k}" style="--accent:${it.accent}">
      <div class="glow g1"></div><div class="glow g2"></div><div class="grid"></div>
      <div class="top"><div class="brand"><img src="${LOGO}" alt=""><span>njabulisto<b>.</b></span></div><span class="pill">${it.pill}</span></div>
      <div class="body">
        <div>
          <h1>${it.title}</h1>
          <div class="price">${it.price}<small>${it.unit}</small></div>
          <ul>${it.points.map(p => `<li>${p}</li>`).join("")}</ul>
        </div>
        <div class="art">${it.art}</div>
      </div>
      <div class="foot">${FOOT}</div>
    </section>`).join("");
  document.getElementById("cards").innerHTML = html;
</script>
</body>
</html>
